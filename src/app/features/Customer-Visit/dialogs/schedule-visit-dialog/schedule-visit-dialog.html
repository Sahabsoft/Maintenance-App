<h2 mat-dialog-title class="text-center">
  <i class="fa-solid fa-calendar-days text-primary me-2"></i>
  جدولة الزيارة
</h2> 
<mat-dialog-content>

  <div class="row mt-2">

    <!-- الفني -->

    <div class="col-12 mb-3">

      <mat-form-field appearance="outline" class="w-100">

        <mat-label>الفني</mat-label>

        <mat-select [(ngModel)]="scheduleRequest.technicianId">

          <mat-option
            *ngFor="let technician of technicians"
            [value]="technician.id">

            {{ technician.name }}

          </mat-option>

        </mat-select>

      </mat-form-field>

    </div>

    <!-- التاريخ -->

    <div class="col-md-6 mb-3">

      <mat-form-field appearance="outline" class="w-100">

        <mat-label>تاريخ الزيارة</mat-label>

        <input
          matInput
          [matDatepicker]="picker"
          [(ngModel)]="scheduleRequest.scheduledDate">

        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker">
        </mat-datepicker-toggle>

        <mat-datepicker #picker></mat-datepicker>

      </mat-form-field>

    </div>

  
    <!-- ملاحظات -->

    <!-- <div class="col-12">

      <mat-form-field appearance="outline" class="w-100">

        <mat-label>ملاحظات</mat-label>

        <textarea
          matInput
          rows="4"
          [(ngModel)]="scheduleRequest.notes">
        </textarea>

      </mat-form-field>

    </div> -->

  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-stroked-button
    color="warn"
    mat-dialog-close>

    <i class="fa-solid fa-xmark me-1"></i>
    إلغاء

  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="scheduleVisit()"
    [disabled]="!scheduleRequest.technicianId || !scheduleRequest.scheduledDate ">

    <i class="fa-solid fa-floppy-disk me-1"></i>
    حفظ الجدولة

  </button>

</mat-dialog-actions>
