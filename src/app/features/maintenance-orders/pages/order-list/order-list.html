<div class="container" dir="rtl">
  <h2>أوامر الصيانة</h2>

  <div class="filters">
    <mat-form-field>
      <mat-label>بحث</mat-label>
      <input matInput [(ngModel)]="filter.search" placeholder="ابحث باسم العميل أو رقم الطلب" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>الحالة</mat-label>
      <mat-select [(ngModel)]="filter.status">
        <mat-option [value]="null">الكل</mat-option>
        <mat-option [value]="1">جديد</mat-option>
        <mat-option [value]="2">فحص</mat-option>
        <mat-option [value]="3">إصلاح</mat-option>
        <mat-option [value]="4">جاهز للتسليم</mat-option>
        <mat-option [value]="5">تم التسليم</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="search()">
      بحث
    </button>
  </div>

  <table mat-table [dataSource]="orders">

    <ng-container matColumnDef="orderNumber">
      <th mat-header-cell *matHeaderCellDef>
        رقم الطلب
      </th>
      <td mat-cell *matCellDef="let row">
        {{ row.orderNumber }}
      </td>
    </ng-container>

    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef>
        العميل
      </th>
      <td mat-cell *matCellDef="let row">
        {{ row.customerName }}
      </td>
    </ng-container>

    <ng-container matColumnDef="device">
      <th mat-header-cell *matHeaderCellDef>
        الجهاز
      </th>
      <td mat-cell *matCellDef="let row">
        {{ row.deviceType }}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>
        الحالة
      </th>
      <td mat-cell *matCellDef="let row">
        {{ getStatusText(row.status) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        العمليات
      </th>

      <td mat-cell *matCellDef="let row">
        <button mat-icon-button [routerLink]="['/ad/orders', row.id, 'details']" title="عرض">
          <mat-icon>visibility</mat-icon>
        </button>

        <button mat-icon-button [routerLink]="['/ad/orders', row.id, 'edit']" title="تعديل">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button [routerLink]="['/ad/orders', row.id, 'status']" title="status">
          <mat-icon>update</mat-icon>
        </button>
        <button title="Receipt" mat-icon-button *ngIf="row.status !== 4" (click)="openReceipt(row.id)">
          <mat-icon>download</mat-icon>
        </button>

        <button mat-icon-button *ngIf="row.status !== 4" (click)="deliver(row.id)" title="تسليم">
          <mat-icon>done</mat-icon>
        </button>

        <button title="Delivery Receipt" mat-icon-button *ngIf="row.status !== 5" (click)="openDeliveryReceipt(row.id)">
          <mat-icon>download</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns">
    </tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns">
    </tr>
  </table>
</div>
