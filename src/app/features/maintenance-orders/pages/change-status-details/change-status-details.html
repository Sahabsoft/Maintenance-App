<div class="change-status" dir="rtl">

  <div class="card">

    <h2>تغيير حالة الطلب</h2>

    <!-- Loading -->
    <div class="loading" *ngIf="loading()">
      جارٍ تحميل بيانات الطلب...
    </div>

    <!-- Error -->
    <div class="error" *ngIf="error() && !loading()">
      {{ error() }}
    </div>

    <form
      *ngIf="!loading()"
      (ngSubmit)="submit()"
      class="form"
    >

      <!-- Current Status -->
      <div class="current">
        الحالة الحالية:

        <strong>
          {{ log.oldStatus !== null
            ? getStatusText(log.oldStatus)
            : 'غير محددة'
          }}
        </strong>
      </div>


      <!-- New Status -->
      <label for="newStatus">
        الحالة الجديدة
      </label>

      <select
        id="newStatus"
        name="newStatus"
        [(ngModel)]="log.newStatus"
        [disabled]="saving()"
      >

        <option [ngValue]="null">
          -- اختر الحالة --
        </option>

        <option
          *ngFor="let s of statuses"
          [ngValue]="s.value"
        >
          {{ s.label }}
        </option>

      </select>


      <!-- Notes -->
      <label for="notes">
        ملاحظات
      </label>

      <textarea
        id="notes"
        name="notes"
        [(ngModel)]="log.notes"
        rows="4"
        placeholder="ملاحظات إضافية (اختياري)"
        [disabled]="saving()"
      ></textarea>


      <!-- Files -->
      <label>
        صور الجهاز
      </label>

      <div class="photo-actions">

        <!-- Camera -->
        <label class="photo-btn">

          📷 التقاط صورة

          <input
            type="file"
            accept="image/*"
            capture="environment"
            (change)="onFilesSelected($event)"
            [disabled]="saving()"
            hidden
          />

        </label>


        <!-- Gallery -->
        <label class="photo-btn">

          🖼️ اختيار من المعرض

          <input
            type="file"
            accept="image/*"
            multiple
            (change)="onFilesSelected($event)"
            [disabled]="saving()"
            hidden
          />

        </label>

      </div>


      <!-- Selected Files -->
      <div
        class="selected-files" 
      >

    <div class="file-item" *ngFor="let image of images; let i = index">
  <img [src]="image.url" width="150" />
  <span>{{ image.name }}</span>

  <button
    type="button"
    class="remove"
    (click)="removePreview(i)"
    [disabled]="saving()">
    ×
  </button>
</div>

      </div>


      <!-- Actions -->
      <div class="actions">

        <button
          type="submit"
          [disabled]="saving()"
        >
          {{
            saving()
              ? 'جارٍ الحفظ...'
              : 'حفظ التغيير'
          }}
        </button>


        <button
          type="button"
          class="btn-cancel"
          (click)="cancel()"
          [disabled]="saving()"
        >
          إلغاء
        </button>

      </div>


      <!-- Error -->
      <div
        class="error"
        *ngIf="error()"
      >
        {{ error() }}
      </div>

    </form>

  </div>

</div>
